# CI for python-backend — generated by Backstage "Create pipeline", built on Loop (Everesto-Inc/loop).
# Customise freely: change stage inputs (with:), add your own steps between stages, or replace a stage.
# The guard job (Gitleaks + Trivy) is mandatory — build/push/deploy need it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'mkdocs.yml', 'catalog-info.yaml', '*.md']   # docs/settings only → no rebuild
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/everesto-inc/python-backend

jobs:
  guard:
    uses: Everesto-Inc/loop/.github/workflows/guard.yml@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0
    with:
      runner: ubuntu-24.04-arm

  ci:
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write        # push + clean up images in ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # full history for SonarQube "new code"

      - name: Tests + coverage
        uses: Everesto-Inc/loop/stages/install@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0
        with: { stack: python }

      - name: Code security (Semgrep)
        uses: Everesto-Inc/loop/stages/semgrep@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0

      - name: Quality gate (SonarQube)
        uses: Everesto-Inc/loop/stages/sonarqube@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0
        with: { token: '${{ secrets.SONAR_TOKEN }}' }

      - name: Build + scan image (Trivy)
        id: image
        uses: Everesto-Inc/loop/stages/build-image@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0
        with: { image: '${{ env.IMAGE }}' }

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Everesto-Inc/loop/stages/push-image@d288ef304e4f10102727004981f3855ba9fcccf1 # v1.0.0
        with: { image: '${{ env.IMAGE }}', tag: '${{ steps.image.outputs.tag }}', token: '${{ secrets.GITHUB_TOKEN }}' }
